# Keeps the committed episode fallback current, and watches the YouTube feed.
#
# The commit is the small half of this. The valuable half is that a red run means
# the site's own parser can no longer read the feed — a failure lib/episodes.ts
# deliberately swallows, so nothing else anywhere would ever tell you. GitHub
# emails the repo owner when a scheduled workflow fails; that email IS the alarm.
#
# Twice daily rather than hourly: the live site is on ISR and re-pulls the feed
# every hour by itself, so this file is not what keeps the orbit fresh. It only
# needs to catch the feed breaking, and to stop the cold-start fallback rotting.
name: Refresh episodes

on:
  schedule:
    # 06:10 and 18:10 UTC. Offset from the hour because GitHub's scheduler queues
    # heavily on the hour and jobs get delayed.
    - cron: "10 6,18 * * *"
  workflow_dispatch:

# Least privilege: the job's only side effect is committing one data file.
permissions:
  contents: write

concurrency:
  group: refresh-episodes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # v7 for both: v4 targets Node 20, which the runners now force onto Node 24
      # anyway and warn about on every run. setup-node v5/v6 changed how caching
      # is detected, which does not affect this job — `cache: npm` is explicit.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Needs >= 22.6 for native TypeScript stripping: the script imports
          # lib/feed.ts directly so it exercises the same parser the site uses.
          node-version: "22"
          cache: npm

      # fast-xml-parser is the only thing the script needs, but the lockfile is
      # the honest way to install it.
      - run: npm ci

      # The script retries a failing feed for about a minute before giving up —
      # YouTube throttles shared runner IPs with a bare 404, and a red run has to
      # mean the feed is broken or it stops being worth reading. See the note on
      # ATTEMPTS in the script.
      - name: Fetch feed and refresh fallback
        id: refresh
        run: node scripts/refresh-episodes.mjs

      # The audience numbers on the landing page.
      #
      # `continue-on-error` is the important part, and it is not laziness. This
      # job's red light means ONE thing — the site's parser can no longer read
      # the feed — and that signal is worth more than anything below. A missing
      # YOUTUBE_API_KEY is a configuration state, not a fault, and a quota blip
      # is not a broken feed; letting either turn the run red would train
      # everybody to ignore the email that matters.
      #
      # The page never breaks when this is skipped: lib/stats.ts falls back to
      # the committed file. It just stops getting fresher.
      - name: Refresh channel stats
        id: stats
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/refresh-stats.mjs

      # Runs the site's unit tests against the newly written data, so a feed that
      # parses but produces nonsense cannot be committed unnoticed.
      - name: Test
        if: steps.refresh.outputs.changed == 'true' || steps.stats.outputs.stats_changed == 'true'
        run: npm test

      - name: Commit
        if: steps.refresh.outputs.changed == 'true' || steps.stats.outputs.stats_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -- so a path that did not change is not an error.
          git add -- content/episodes-fallback.json content/channel-stats-fallback.json
          git commit -m "chore: refresh episode and channel-stat fallbacks"
          git push
